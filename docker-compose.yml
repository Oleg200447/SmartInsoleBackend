version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartinsole-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets:ro
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Frontend can be added here when running both services
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: smartinsole-frontend
  #   ports:
  #     - "8501:8501"
  #   environment:
  #     - API_BASE_URL=http://backend:8000
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  default:
    name: smartinsole-network
